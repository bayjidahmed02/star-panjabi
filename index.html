<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>স্টার পাঞ্জাবি — Star Panjabi</title>
    <style>
      /* ---------- Reset ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }

      :root {
        --bg: #ffffff; /* page bg */
        --card: #ffffff; /* card bg */
        --tint: #fafaf7; /* faintest warm white */
        --line: #ececea; /* hairlines */
        --line-soft: #f2f1ed;
        --gold: #b48438; /* primary gold */
        --gold-deep: #8a5f1f;
        --gold-soft: #d8b56a;
        --ink: #1a1410; /* near-black */
        --ink-2: #0d0a07;
        --muted: #7a6f62;
        --crimson: #8a1f24;
        --crimson-2: #6a1418;
      }

      body {
        font-family:
          "SolaimanLipi",
          "Hind Siliguri",
          "Noto Sans Bengali",
          "Kalpurush",
          "Siyam Rupali",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        background: radial-gradient(
          ellipse 90% 70% at 50% 25%,
          #ffffff 0%,
          #f7f6f2 70%,
          #efece4 100%
        );
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        overflow-x: hidden;
      }

      /* ---------- Phone frame ---------- */
      .phone {
        position: relative;
        width: 100%;
        max-width: 420px;
        min-height: min(880px, calc(100svh - 48px));
        border-radius: 32px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(
            ellipse 80% 35% at 50% 0%,
            rgba(216, 181, 106, 0.1) 0%,
            rgba(216, 181, 106, 0) 60%
          ),
          var(--card);
        box-shadow:
          0 30px 80px -30px rgba(40, 30, 15, 0.18),
          0 14px 36px -18px rgba(40, 30, 15, 0.1),
          0 0 0 1px rgba(180, 132, 56, 0.14);
        animation: pageFade 1100ms ease-out both;
      }
      /* Single subtle gold inlay */
      .phone::before {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 22px;
        pointer-events: none;
        border: 1px solid rgba(180, 132, 56, 0.22);
        z-index: 1;
      }
      .phone::after {
        content: "";
        position: absolute;
        inset: 17px;
        border-radius: 19px;
        pointer-events: none;
        border: 1px solid rgba(180, 132, 56, 0.06);
        z-index: 1;
      }

      .stage {
        position: relative;
        z-index: 2;
        padding: 56px 28px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100%;
      }

      /* ---------- Top mark ---------- */
      .topmark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        color: var(--gold);
        font-size: 10.5px;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 600;
        animation: rise 800ms cubic-bezier(0.2, 0.7, 0.2, 1) 80ms both;
      }
      .topmark .ln {
        width: 28px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold) 50%,
          transparent
        );
      }

      /* ---------- Logo ---------- */
      .logo-wrap {
        position: relative;
        width: 172px;
        height: 172px;
        display: grid;
        place-items: center;
        margin-bottom: 26px;
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 140ms both;
      }
      /* Soft golden glow */
      .logo-wrap::before {
        content: "";
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(212, 160, 70, 0.32) 0%,
          rgba(212, 160, 70, 0.14) 30%,
          rgba(212, 160, 70, 0) 65%
        );
        filter: blur(6px);
        z-index: 0;
        animation: pulse 4.5s ease-in-out infinite;
      }
      .logo-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow:
          0 0 0 1px rgba(180, 132, 56, 0.45),
          0 0 0 6px #ffffff,
          0 0 0 7px rgba(180, 132, 56, 0.22),
          0 14px 28px -12px rgba(40, 30, 15, 0.18);
        z-index: 2;
        pointer-events: none;
      }
      .logo {
        position: relative;
        width: 152px;
        height: 152px;
        border-radius: 50%;
        object-fit: cover;
        z-index: 1;
        background: #1a0d06;
      }

      /* ---------- Title ---------- */
      .title {
        font-size: 24px;
        line-height: 1.5;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0.2px;
        color: var(--ink);
        margin-bottom: 12px;
        text-wrap: balance;
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 240ms both;
      }
      /* Star divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 14px;
        width: 70%;
        color: var(--gold);
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 320ms both;
      }
      .divider .line {
        flex: 1;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(180, 132, 56, 0.55) 50%,
          transparent
        );
      }
      .divider svg {
        color: var(--gold);
      }

      .subtitle {
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--muted);
        text-align: center;
        letter-spacing: 0.3px;
        max-width: 290px;
        margin-bottom: 32px;
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 400ms both;
      }
      .subtitle .accent {
        color: var(--crimson);
        font-weight: 600;
      }

      /* ---------- Buttons ---------- */
      .actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 28px;
      }
      .btn {
        --accent: 180, 132, 56;
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-height: 64px;
        padding: 12px 16px 12px 12px;
        border-radius: 16px;
        text-decoration: none;
        color: var(--ink);
        font-weight: 600;
        font-size: 15.5px;
        letter-spacing: 0.2px;
        cursor: pointer;
        isolation: isolate;
        background: #ffffff;
        border: 1px solid var(--line);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 4px 14px -10px rgba(40, 30, 15, 0.18);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease,
          background 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      /* Left accent rail */
      .btn::before {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: linear-gradient(
          180deg,
          rgba(var(--accent), 0) 0%,
          rgba(var(--accent), 0.9) 50%,
          rgba(var(--accent), 0) 100%
        );
        opacity: 0.7;
        transition:
          opacity 0.25s ease,
          width 0.25s ease;
      }
      /* Subtle outer glow ring on hover/touch */
      .btn::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 17px;
        pointer-events: none;
        box-shadow: 0 0 0 0 rgba(var(--accent), 0);
        transition: box-shadow 0.35s ease;
        z-index: -1;
      }
      .btn:hover,
      .btn:focus-visible,
      .btn:active {
        transform: translateY(-1px) scale(1.012);
        border-color: rgba(var(--accent), 0.45);
        background: linear-gradient(180deg, #ffffff 0%, var(--tint) 100%);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 10px 22px -12px rgba(40, 30, 15, 0.2);
        outline: none;
      }
      .btn:hover::before,
      .btn:focus-visible::before,
      .btn:active::before {
        opacity: 1;
        width: 4px;
      }
      .btn:hover::after,
      .btn:focus-visible::after,
      .btn:active::after {
        box-shadow:
          0 0 0 1px rgba(var(--accent), 0.2),
          0 0 26px 2px rgba(var(--accent), 0.18);
      }
      .btn:active {
        transform: translateY(0) scale(0.992);
      }

      .btn .ico {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #ffffff 0%, #f6f5f1 100%);
        box-shadow:
          inset 0 0 0 1px rgba(180, 132, 56, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        color: var(--gold-deep);
        transition:
          background 0.25s ease,
          color 0.25s ease,
          box-shadow 0.25s ease;
      }
      .btn .ico svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      .btn .text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1.2;
      }
      .btn .text .lbl {
        color: var(--ink);
      }
      .btn .text .sub {
        font-size: 11px;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 500;
      }

      .btn .chev {
        margin-left: auto;
        color: rgba(180, 132, 56, 0.55);
        transition:
          transform 0.25s ease,
          color 0.25s ease;
      }
      .btn:hover .chev {
        color: var(--gold-deep);
        transform: translateX(3px);
      }

      /* Per-button accents */
      .btn.call {
        --accent: 138, 31, 36;
      }
      .btn.call .ico {
        background: linear-gradient(180deg, #ffffff 0%, #fbf2f2 100%);
        color: var(--crimson);
        box-shadow:
          inset 0 0 0 1px rgba(138, 31, 36, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* ---------- Footer ---------- */
      .foot {
        margin-top: auto;
        padding-top: 12px;
        text-align: center;
        font-size: 10.5px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gold-deep);
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 700ms both;
        font-weight: 600;
      }
      .foot .dot {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--gold);
        margin: 0 8px;
        vertical-align: middle;
      }

      /* Stagger button entrance */
      .btn {
        animation: rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .btn:nth-child(1) {
        animation-delay: 480ms;
      }
      .btn:nth-child(2) {
        animation-delay: 560ms;
      }
      .btn:nth-child(3) {
        animation-delay: 640ms;
      }
      .btn:nth-child(4) {
        animation-delay: 720ms;
      }

      /* ---------- Animations ---------- */
      @keyframes pageFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---------- Mobile: full-screen, no card frame ---------- */
      @media (max-width: 480px) {
        body {
          padding: 0;
          align-items: stretch;
          background: #f7f6f2;
        }

        .phone {
          border-radius: 0;
          box-shadow: none;
          min-height: 100svh;
          max-width: 100%;
          background: #ffffff;
        }

        .phone::before,
        .phone::after {
          display: none;
        }

        .stage {
          padding: 48px 20px 32px;
        }

        .logo-wrap {
          width: 148px;
          height: 148px;
        }

        .logo {
          width: 128px;
          height: 128px;
        }

        .title {
          font-size: 21px;
        }

        .subtitle {
          font-size: 13px;
          max-width: 100%;
        }

        .btn {
          min-height: 60px;
          border-radius: 14px;
        }

        .btn::after {
          border-radius: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone" role="main" aria-label="Star Panjabi">
      <div class="stage">
        <div class="topmark" aria-hidden="true">
          <span class="ln"></span>
          <span>Premium Boutique</span>
          <span class="ln"></span>
        </div>

        <div class="logo-wrap">
          <img class="logo" src="logo.jpg" alt="Star Panjabi logo" />
        </div>

        <h1 class="title">স্টার পাঞ্জাবিতে&nbsp;আপনাকে&nbsp;স্বাগতম</h1>

        <div class="divider" aria-hidden="true">
          <span class="line"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2.6l2.7 6.2 6.7.6-5 4.5 1.5 6.6L12 17l-5.9 3.5 1.5-6.6-5-4.5 6.7-.6z"
            />
          </svg>
          <span class="line"></span>
        </div>

        <p class="subtitle">
          ঐতিহ্য ও আধুনিকতার মেলবন্ধনে&nbsp;<span class="accent"
            >প্রিমিয়াম পাঞ্জাবি</span
          >। নিচে যোগাযোগের মাধ্যম বেছে নিন।
        </p>

        <nav class="actions" aria-label="Contact options">
          <a
            class="btn facebook"
            href="https://facebook.com/"
            target="_blank"
            rel="noopener"
          >
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M13.5 21v-7.6h2.55l.38-2.96H13.5V8.55c0-.86.24-1.45 1.47-1.45h1.57V4.46c-.27-.04-1.2-.12-2.28-.12-2.26 0-3.81 1.38-3.81 3.92v2.18H7.9v2.96h2.55V21h3.05z"
                />
              </svg>
            </span>
            <span class="text">
              <span class="lbl">ফেসবুক পেজ</span>
              <span class="sub">Visit on Facebook</span>
            </span>
            <svg
              class="chev"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </a>

          <a
            class="btn whatsapp"
            href="https://wa.me/"
            target="_blank"
            rel="noopener"
          >
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M19.05 4.94A10 10 0 0 0 3.46 17.32L2 22l4.78-1.42a10 10 0 0 0 4.79 1.22h.01A10 10 0 0 0 19.05 4.94zM12.58 19.9h-.01a8.3 8.3 0 0 1-4.23-1.16l-.3-.18-2.83.84.84-2.76-.2-.32a8.3 8.3 0 1 1 6.73 3.58zm4.55-6.22c-.25-.13-1.47-.73-1.7-.81-.23-.08-.4-.13-.56.13-.17.25-.65.81-.79.97-.15.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.01-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.48c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.02 0 1.19.87 2.34.99 2.5.12.17 1.71 2.6 4.14 3.65.58.25 1.03.4 1.38.51.58.18 1.1.16 1.52.1.46-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3z"
                />
              </svg>
            </span>
            <span class="text">
              <span class="lbl">হোয়াটসঅ্যাপ</span>
              <span class="sub">Chat with us</span>
            </span>
            <svg
              class="chev"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </a>

          <a class="btn call" href="tel:+880">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"
                />
              </svg>
            </span>
            <span class="text">
              <span class="lbl">সরাসরি কল করুন</span>
              <span class="sub">Call now</span>
            </span>
            <svg
              class="chev"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </a>

          <a class="btn email" href="mailto:hello@starpanjabi.com">
            <span class="ico" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="5" width="18" height="14" rx="2.5" />
                <path d="M3.5 7.2l8.5 6 8.5-6" />
              </svg>
            </span>
            <span class="text">
              <span class="lbl">ইমেইল করুন</span>
              <span class="sub">Send an email</span>
            </span>
            <svg
              class="chev"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </a>
        </nav>

        <div class="foot">
          Premium Panjabi <span class="dot"></span> Est. Bangladesh
        </div>
      </div>
    </main>
  </body>
</html>
